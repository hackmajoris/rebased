name: Publish to package managers
on:
  release:
    types: [released]
jobs:
  homebrew:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        repository: hackmajoris/homebrew-apps
        persist-credentials: false
        submodules: true
    - name: bump cask pr
      env:
        # zizmor: ignore[secrets-outside-env] TODO
        HOMEBREW_GITHUB_API_TOKEN: "${{ secrets.HOMEBREW_TOKEN }}"
        version: ${{ github.event.release.tag_name }}
      run: |
        cd ./brew/bin
        ./brew tap hackmajoris/apps
        ./brew trust hackmajoris/apps
        ./brew bump-cask-pr rebased --version $version
