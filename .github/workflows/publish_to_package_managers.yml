name: Publish to package managers
on:
  release:
    types: [released]
jobs:
  homebrew:
    runs-on: macos-latest
    steps:
    - name: bump cask pr
      env:
        # zizmor: ignore[secrets-outside-env] TODO
        HOMEBREW_GITHUB_API_TOKEN: "${{ secrets.HOMEBREW_TOKEN }}"
        version: ${{ github.event.release.tag_name }}
      # macos-latest runners ship with Homebrew preinstalled -- no need to check out a
      # separate brew binary, and `trust` isn't a stock Homebrew command anyway (it's
      # from Workbrew, a different product), so it's dropped here.
      run: |
        brew tap hackmajoris/apps
        brew bump-cask-pr rebased --version $version